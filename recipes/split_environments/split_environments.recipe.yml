name: Split Environments
description: Configures a Drupal 11 site with environment-specific configuration splits for local, develop, staged, and main environments, with user awareness signals and a customized front page.
type: project
install:
  - config_split
  - environment_indicator
  - stage_file_proxy
  - structure_sync
  - config_suite
config:
  import:
    local:
      - config_suite.settings
      - stage_file_proxy.settings
    develop:
      - config_suite.settings
    staged:
      - config_suite.settings
    main:
      - config_suite.settings
    sync:
      - config_split.config_split.local
      - config_split.config_split.develop
      - config_split.config_split.staged
      - config_split.config_split.main      
  actions:
    local:
      config_suite.settings:
        import: true
        export: true
      stage_file_proxy.settings:
        origin: ''
    develop:
      config_suite.settings:
        import: true
        export: true
    staged:
      config_suite.settings:
        import: true
        export: false
    main:
      config_suite.settings:
        import: true
        export: true
content:
  nodes:
    - entity: node
      type: page
      title: Welcome to Your Drupal 11 CI/CD with DDEV Website
      field_body:
        value: |
          Welcome to your Drupal 11 CI/CD with DDEV website. We hope you enjoy your Drupal experience.

          The Drupal 11 template you installed took advantage of a very basic Drupal recipe to set up your starting point. Here is an outline of the key next steps to follow: [Next Steps](https://github.com/YOUR_NAMESPACE/drupal11/blob/main/added_documentation/Next%20Steps.md).

          Below are a list of resources to help you work with Drupal:
          - [Drupal User Guide](https://www.drupal.org/docs/user_guide/en/index.html)
          - [Drupalize.Me Tutorials](https://drupalize.me/)
          - [Drupal.org Community Documentation](https://www.drupal.org/documentation)
          - [Drupal Slack Community](https://www.drupal.org/slack)
          - [WebWash Drupal Tutorials](https://www.webwash.net/)

          Recipes are a great way to quickly get going with Drupal. The recipe that started this project foundation is intentionally very basic so people who use it can go in any different directions; a strength of Drupal. But you can add recipes to recipes so don’t be afraid to try more from the list below. And remember, you established a workflow where you can try them and simply not move them up your workflow as a way to back out and return to what you had.

          Available Drupal Recipes:
          - [Blog](https://www.drupal.org/project/blog)
          - [Standard](https://www.drupal.org/project/standard)
          - [Umami](https://www.drupal.org/project/umami)
          - [Commerce](https://www.drupal.org/project/commerce)
          - [Group](https://www.drupal.org/project/group)
          - [Open Social](https://www.drupal.org/project/social)
          - [Learning Management System](https://www.drupal.org/project/opigno_lms)
files:
  added_documentation/Next Steps.md:
    content: |
      # Next Steps for Your Drupal 11 CI/CD with DDEV Project

      Congratulations on setting up your Drupal 11 project with a CI/CD workflow using DDEV and Platform.sh! Below are the recommended next steps to help you get the most out of your project:

      1. **Explore Your Local Environment**:
         - Use `ddev start` to launch your local environment and access your site at `https://<projectname>.ddev.site`.
         - Run `ddev drush si` to install Drupal with the `Split_Environments` recipe applied.
         - Verify the environment indicator displays "Local" with a green background (#006600).

      2. **Configure Your GitHub Repository**:
         - Ensure your repository is connected to Platform.sh for automatic branch deployments.
         - Push changes to the `develop`, `staged`, or `main` branches to trigger deployments to their respective environments.
         - Check the Platform.sh dashboard to monitor deployment status.

      3. **Customize Environment Configurations**:
         - Modify the `config/<environment>/config_suite.settings.yml` files to adjust import/export behavior as needed.
         - Use `drush config-split:export <environment>` to export configurations to the respective split directories (e.g., `../config/develop`).
         - Test configuration imports with `drush config-split:import <environment>` in each environment.

      4. **Leverage Stage File Proxy**:
         - In your local environment, ensure `stage_file_proxy.settings.yml` is configured to pull files from a production or staging environment if needed.
         - Update the `origin` setting in `stage_file_proxy.settings` for local development if you have a Platform.sh relationship defined.

      5. **Experiment with Additional Recipes**:
         - Explore other Drupal recipes listed on the front page to extend functionality (e.g., Commerce, Open Social).
         - Apply recipes locally and test them before pushing to other environments.

      6. **Engage with the Drupal Community**:
         - Join the Drupal Slack community or Drupal.org forums for support and collaboration.
         - Follow tutorials on Drupalize.Me or WebWash for advanced Drupal development techniques.

      7. **Monitor and Test**:
         - Use the `staged` environment for thorough testing before promoting changes to `main`.
         - Disable automatic config imports in the `staged` environment to ensure manual review before deployment.

      For more details, refer to the Drupal documentation and the Platform.sh integration guides linked on your site’s front page.